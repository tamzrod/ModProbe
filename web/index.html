<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModProbe</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1rem; background: #f8fafc; color: #0f172a; }
    h1 { margin-bottom: 0.5rem; }
    .panel { background: #fff; border: 1px solid #dbe2ea; border-radius: 8px; padding: 0.85rem; margin-bottom: 0.9rem; }
    .panel h2 { margin-top: 0; margin-bottom: 0.65rem; font-size: 1.1rem; }
    .row { display: flex; gap: 0.55rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.5rem; }
    label { font-size: 0.9rem; font-weight: 600; display: inline-flex; flex-direction: column; gap: 0.25rem; }
    input, select, button { padding: 0.4rem 0.55rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    input[type="checkbox"] { width: 18px; height: 18px; }
    button { cursor: pointer; background: #fff; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #dbe2ea; padding: 0.5rem; font-size: 0.88rem; text-align: left; }
    th { background: #f1f5f9; }
    .dec-editable { cursor: text; background: #f8fafc; }
    .coil-toggle { cursor: pointer; font-weight: 600; }
    .dirty { background: #fff7cc; }
    .actions { display: flex; gap: 0.4rem; }
    .status-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; font-size: 0.88rem; }
    .status-pill { padding: 0.2rem 0.5rem; border-radius: 999px; font-weight: 700; }
    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .inline-controls { display: flex; gap: 0.35rem; align-items: center; }
    .small-btn { padding: 0.35rem 0.5rem; font-size: 0.78rem; }
    .modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal.hidden { display: none; }
    .modal-card {
      width: min(620px, calc(100vw - 2rem));
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.22);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.55rem; }
    .modal-header h3 { margin: 0; font-size: 1.2rem; }
    .test-actions { margin-top: 0.55rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .test-action-btn {
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-weight: 700;
      padding: 0.5rem 0.75rem;
      transition: transform 0.08s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .test-action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
      border-color: #93c5fd;
    }
    .modal-output {
      margin-top: 0.7rem;
      min-height: 240px;
      max-height: 300px;
      overflow: auto;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      background: #f8fafc;
      padding: 0.6rem;
      display: grid;
      gap: 0.45rem;
    }
    .test-sample-card {
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      background: #fff;
      padding: 0.5rem 0.6rem;
      display: grid;
      gap: 0.2rem;
      font-size: 0.84rem;
    }
    .test-sample-card.success { border-color: #86efac; background: #f0fdf4; }
    .test-sample-card.fail { border-color: #fecaca; background: #fef2f2; }
    .test-sample-card.pending { border-color: #bfdbfe; background: #eff6ff; }
    .sample-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      width: fit-content;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .sample-status.success { color: #166534; background: #dcfce7; }
    .sample-status.fail { color: #991b1b; background: #fee2e2; }
    .sample-status.pending { color: #1d4ed8; background: #dbeafe; }
    .sample-muted { color: #475569; font-style: italic; }
  </style>
</head>
<body>
  <h1>ModProbe - Basic Mode</h1>

  <div class="panel">
    <h2>Config Panel</h2>
    <div class="row">
      <label>IP:Port
        <div class="inline-controls">
          <input id="target" type="text" value="127.0.0.1:502" />
          <button id="openTestBtn" class="small-btn" type="button">Test</button>
        </div>
      </label>
      <label>Unit ID
        <input id="unitId" type="number" min="0" max="255" value="1" />
      </label>
      <label>Timeout ms
        <input id="timeoutMs" type="number" min="1" value="500" />
      </label>
      <label>Function Code
        <select id="functionCode">
          <option value="1">01 Coils</option>
          <option value="2">02 Discrete Inputs</option>
          <option value="3" selected>03 Holding Registers</option>
          <option value="4">04 Input Registers</option>
        </select>
      </label>
      <label>Start Address
        <input id="startAddress" type="number" min="0" value="0" />
      </label>
      <label>Quantity
        <input id="quantity" type="number" min="1" value="10" />
      </label>
    </div>
  </div>

  <div class="panel">
    <h2>Polling Controls</h2>
    <div class="row">
      <label style="flex-direction: row; align-items: center; gap: 0.4rem; font-weight: 700;">Poll Enable
        <input id="pollEnable" type="checkbox" />
      </label>
      <label>Interval ms
        <input id="intervalMs" type="number" min="1" value="1000" />
      </label>
      <button id="readAllBtn" type="button">READ ALL</button>
      <span id="errorText" style="color: #b91c1c; font-weight: 600;"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Output Table</h2>
    <table>
      <thead>
        <tr>
          <th>Address</th>
          <th>Value (Hex)</th>
          <th>Value (Dec)</th>
          <th>Exception</th>
          <th>Timestamp</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="rowsBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Status Bar</h2>
    <div class="status-bar">
      <div>Connection: <span id="connStatus" class="status-pill bad">UNKNOWN</span></div>
      <div>Last read: <span id="lastRead" class="mono">-</span></div>
      <div>Polling: <span id="pollStatus" class="mono">Stopped</span></div>
    </div>
  </div>

  <div id="testModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="testModalTitle" aria-describedby="testModalDesc">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="testModalTitle">Test Connection</h3>
        <button id="closeTestBtn" type="button" aria-label="Close test dialog">Close</button>
      </div>
      <p id="testModalDesc" style="margin-top: 0; margin-bottom: 0.55rem; font-size: 0.86rem;">Choose the test type and run a connection diagnostic.</p>
      <label>IP:Port
        <input id="testTarget" type="text" />
      </label>
      <div class="test-actions">
        <button id="runTcpTestBtn" class="test-action-btn" type="button">Run TCP Test</button>
        <button id="runIcmpTestBtn" class="test-action-btn" type="button">Run ICMP Test</button>
      </div>
      <div id="testOutput" class="modal-output"></div>
    </div>
  </div>

<script>
const rowsByAddress = new Map();
const dirtyRows = new Set();

const el = {
  target: document.getElementById('target'),
  unitId: document.getElementById('unitId'),
  timeoutMs: document.getElementById('timeoutMs'),
  functionCode: document.getElementById('functionCode'),
  startAddress: document.getElementById('startAddress'),
  quantity: document.getElementById('quantity'),
  pollEnable: document.getElementById('pollEnable'),
  intervalMs: document.getElementById('intervalMs'),
  readAllBtn: document.getElementById('readAllBtn'),
  rowsBody: document.getElementById('rowsBody'),
  connStatus: document.getElementById('connStatus'),
  lastRead: document.getElementById('lastRead'),
  pollStatus: document.getElementById('pollStatus'),
  errorText: document.getElementById('errorText'),
  openTestBtn: document.getElementById('openTestBtn'),
  testModal: document.getElementById('testModal'),
  closeTestBtn: document.getElementById('closeTestBtn'),
  testTarget: document.getElementById('testTarget'),
  runTcpTestBtn: document.getElementById('runTcpTestBtn'),
  runIcmpTestBtn: document.getElementById('runIcmpTestBtn'),
  testOutput: document.getElementById('testOutput')
};

let statusTimer = null;
// Tracks the active range config so stale rows can be cleared when range changes.
let lastRangeKey = '';
let previousActiveElement = null;
const testHistory = [];

function getConfig() {
  return {
    target: el.target.value.trim(),
    unit_id: Number(el.unitId.value),
    timeout_ms: Number(el.timeoutMs.value),
    function_code: Number(el.functionCode.value),
    start_address: Number(el.startAddress.value),
    quantity: Number(el.quantity.value)
  };
}

function getCurrentRangeKey() {
  return `${Number(el.functionCode.value)}:${Number(el.startAddress.value)}:${Number(el.quantity.value)}`;
}

function isWriteMode() {
  const fc = Number(el.functionCode.value);
  return fc === 1 || fc === 3;
}

function isPolling() {
  return el.pollEnable.checked;
}

function formatHexValue(functionCode, value) {
  if (functionCode === 1) {
    return value === 0 ? '0x0000' : '0x0001';
  }
  return `0x${value.toString(16).toUpperCase().padStart(4, '0')}`;
}

const EXCEPTION_LABELS = {
  '0x01': 'Illegal Function',
  '0x02': 'Illegal Data Address',
  '0x03': 'Illegal Data Value',
  '0x04': 'Server Device Failure',
  '0x05': 'Acknowledge',
  '0x06': 'Server Device Busy',
  '0x08': 'Memory Parity Error',
  '0x0A': 'Gateway Path Unavailable',
  '0x0B': 'Gateway Target Device Failed to Respond'
};

function formatException(code) {
  const normalized = String(code || '').trim().toUpperCase();
  if (!normalized) return { label: '', title: '' };
  return {
    label: EXCEPTION_LABELS[normalized] || 'Unknown Exception',
    title: normalized
  };
}

function setError(message = '') {
  el.errorText.textContent = message;
}

function renderTestSamples() {
  el.testOutput.innerHTML = '';
  for (let index = 0; index < 4; index += 1) {
    const item = testHistory[index];
    const card = document.createElement('div');
    card.className = 'test-sample-card';
    if (!item) {
      card.innerHTML = `<div class="sample-muted">Sample ${index + 1}: waiting for test result</div>`;
      el.testOutput.appendChild(card);
      continue;
    }
    const stateClass = item.pending ? 'pending' : (item.success ? 'success' : 'fail');
    card.classList.add(stateClass);
    const statusLabel = item.pending ? 'RUNNING' : (item.success ? 'SUCCESS' : 'FAIL');
    const statusIcon = item.pending ? '…' : (item.success ? '✓' : '✕');
    const latency = Number.isFinite(item.latency_ms) ? `${item.latency_ms} ms` : 'N/A';
    const error = item.error || '-';
    card.innerHTML = `
      <div class="sample-status ${stateClass}">${statusIcon} ${statusLabel}</div>
      <div><strong>Type:</strong> ${(item.type || 'unknown').toUpperCase()}</div>
      <div><strong>Target:</strong> ${item.target || '-'}</div>
      <div><strong>Latency:</strong> ${latency}</div>
      <div><strong>Error:</strong> ${error}</div>
    `;
    el.testOutput.appendChild(card);
  }
}

function setTestButtonsDisabled(disabled) {
  el.runTcpTestBtn.disabled = disabled;
  el.runIcmpTestBtn.disabled = disabled;
}

async function apiFetch(path, payload) {
  const opts = payload
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }
    : { method: 'GET' };
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = {};
  if (text) {
    try { data = JSON.parse(text); } catch { data = { error: text }; }
  }
  if (!res.ok) {
    throw new Error(data.error || `HTTP ${res.status}`);
  }
  return data;
}

function openTestModal() {
  previousActiveElement = document.activeElement;
  el.testTarget.value = el.target.value.trim();
  testHistory.length = 0;
  renderTestSamples();
  el.testModal.classList.remove('hidden');
  el.testTarget.focus();
}

function closeTestModal() {
  el.testModal.classList.add('hidden');
  if (previousActiveElement && typeof previousActiveElement.focus === 'function') {
    previousActiveElement.focus();
  }
}

function getTestModalFocusable() {
  return [el.closeTestBtn, el.testTarget, el.runTcpTestBtn, el.runIcmpTestBtn]
    .filter((node) => node && !node.disabled);
}

function handleTestModalKeydown(event) {
  if (el.testModal.classList.contains('hidden')) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    closeTestModal();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = getTestModalFocusable();
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
    return;
  }
  if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

async function runTest(type) {
  const sample = {
    type,
    target: el.testTarget.value.trim(),
    success: false,
    latency_ms: null,
    error: '',
    pending: true
  };
  testHistory.unshift(sample);
  testHistory.length = Math.min(testHistory.length, 4);
  renderTestSamples();
  setTestButtonsDisabled(true);
  try {
    const data = await apiFetch('/api/test', {
      type,
      target: el.testTarget.value.trim(),
      timeout_ms: Number(el.timeoutMs.value)
    });
    sample.type = data.type || type;
    sample.target = data.target || sample.target;
    sample.success = Boolean(data.success);
    sample.latency_ms = Number.isFinite(data.latency_ms) ? data.latency_ms : null;
    sample.error = data.error || '';
    sample.pending = false;
    renderTestSamples();
  } catch (err) {
    sample.success = false;
    sample.error = err.message;
    sample.pending = false;
    renderTestSamples();
  } finally {
    setTestButtonsDisabled(false);
  }
}

function renderRows() {
  const canWrite = isWriteMode();
  const readOnlyTable = isPolling();
  const rows = Array.from(rowsByAddress.values()).sort((a, b) => a.address - b.address);
  el.rowsBody.innerHTML = '';

  rows.forEach((row) => {
    const tr = document.createElement('tr');
    if (dirtyRows.has(row.address)) tr.classList.add('dirty');

    const addressTd = document.createElement('td');
    addressTd.textContent = String(row.address);

    const hexTd = document.createElement('td');
    hexTd.textContent = row.value_hex || '';

    const decTd = document.createElement('td');
    decTd.textContent = String(row.value_dec ?? '');

    if (canWrite && !readOnlyTable) {
      if (Number(el.functionCode.value) === 1) {
        decTd.classList.add('coil-toggle');
        decTd.title = 'Click to toggle ON/OFF';
        decTd.onclick = () => {
          const next = Number(row.value_dec) === 0 ? 1 : 0;
          row.value_dec = next;
          row.value_hex = formatHexValue(1, next);
          row.exception = '';
          row.timestamp = new Date().toISOString();
          rowsByAddress.set(row.address, row);
          dirtyRows.add(row.address);
          renderRows();
        };
      } else {
        decTd.classList.add('dec-editable');
        decTd.contentEditable = 'true';
        decTd.title = 'Double-click to edit';
        decTd.ondblclick = () => {
          decTd.focus();
          const selection = window.getSelection();
          if (!selection) return;
          const range = document.createRange();
          range.selectNodeContents(decTd);
          selection.removeAllRanges();
          selection.addRange(range);
        };
        decTd.onblur = () => {
          const functionCode = Number(el.functionCode.value);
          const parsed = Number(decTd.textContent.trim());
          if (!Number.isInteger(parsed) || parsed < 0 || parsed > 65535) {
            decTd.textContent = String(row.value_dec ?? '');
            return;
          }
          if (functionCode === 1 && parsed !== 0 && parsed !== 1) {
            decTd.textContent = String(row.value_dec ?? '');
            return;
          }
          row.value_dec = parsed;
          row.value_hex = formatHexValue(functionCode, parsed);
          row.exception = '';
          row.timestamp = new Date().toISOString();
          rowsByAddress.set(row.address, row);
          dirtyRows.add(row.address);
          renderRows();
        };
      }
    }

    const exceptionTd = document.createElement('td');
    const exception = formatException(row.exception);
    exceptionTd.textContent = exception.label;
    if (exception.title) {
      exceptionTd.title = exception.title;
    }

    const timestampTd = document.createElement('td');
    timestampTd.textContent = row.timestamp || '';

    const actionTd = document.createElement('td');
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'actions';

    const readBtn = document.createElement('button');
    readBtn.type = 'button';
    readBtn.textContent = 'READ';
    readBtn.onclick = () => readSingleRow(row.address);
    actionsDiv.appendChild(readBtn);

    if (canWrite) {
      const writeBtn = document.createElement('button');
      writeBtn.type = 'button';
      writeBtn.textContent = 'WRITE';
      writeBtn.disabled = readOnlyTable || !dirtyRows.has(row.address);
      writeBtn.onclick = () => writeSingleRow(row.address);
      actionsDiv.appendChild(writeBtn);
    }

    actionTd.appendChild(actionsDiv);
    tr.append(addressTd, hexTd, decTd, exceptionTd, timestampTd, actionTd);
    el.rowsBody.appendChild(tr);
  });
}

function syncRows(rows) {
  rows.forEach((row) => {
    rowsByAddress.set(row.address, row);
    dirtyRows.delete(row.address);
  });
  renderRows();
}

function replaceRows(rows) {
  clearRows();
  syncRows(rows);
}

function clearRows() {
  rowsByAddress.clear();
  dirtyRows.clear();
  renderRows();
}

function clearRowsIfRangeChanged() {
  const nextKey = getCurrentRangeKey();
  if (nextKey === lastRangeKey) return;
  lastRangeKey = nextKey;
  clearRows();
}

async function readAll() {
  setError('');
  clearRowsIfRangeChanged();
  try {
    const data = await apiFetch('/api/read/bulk', { config: getConfig() });
    replaceRows(data.rows || []);
    await refreshStatus();
  } catch (err) {
    setError(err.message);
  }
}

async function readSingleRow(address) {
  setError('');
  try {
    const data = await apiFetch('/api/read/single', { config: getConfig(), address });
    if (data.row) {
      syncRows([data.row]);
    }
    await refreshStatus();
  } catch (err) {
    setError(err.message);
  }
}

async function writeSingleRow(address) {
  const row = rowsByAddress.get(address);
  if (!row) return;
  setError('');
  try {
    const data = await apiFetch('/api/write/single', {
      config: getConfig(),
      address,
      value: Number(row.value_dec)
    });
    if (data.row) {
      syncRows([data.row]);
    }
    await refreshStatus();
  } catch (err) {
    setError(err.message);
  }
}

async function refreshStatus() {
  try {
    const status = await apiFetch('/api/status');
    el.connStatus.textContent = status.connected ? 'CONNECTED' : 'DISCONNECTED';
    el.connStatus.className = `status-pill ${status.connected ? 'ok' : 'bad'}`;
    el.lastRead.textContent = status.last_read_timestamp || '-';
    el.pollStatus.textContent = status.polling_active
      ? `Running (${status.polling_interval_ms} ms)`
      : 'Stopped';
    if (status.polling_active && Array.isArray(status.rows)) {
      replaceRows(status.rows);
    }
  } catch (err) {
    setError(err.message);
  }
}

async function startPolling() {
  setError('');
  try {
    await apiFetch('/api/polling/start', {
      config: getConfig(),
      interval_ms: Number(el.intervalMs.value)
    });
    renderRows();
    await refreshStatus();
  } catch (err) {
    setError(err.message);
    el.pollEnable.checked = false;
  }
}

async function stopPolling() {
  setError('');
  try {
    await apiFetch('/api/polling/stop', {});
    renderRows();
    await refreshStatus();
  } catch (err) {
    setError(err.message);
  }
}

function ensureStatusTimer() {
  if (statusTimer) return;
  statusTimer = setInterval(refreshStatus, 1000);
}

el.readAllBtn.addEventListener('click', readAll);
el.openTestBtn.addEventListener('click', openTestModal);
el.closeTestBtn.addEventListener('click', closeTestModal);
el.runTcpTestBtn.addEventListener('click', () => runTest('tcp'));
el.runIcmpTestBtn.addEventListener('click', () => runTest('icmp'));
document.addEventListener('keydown', handleTestModalKeydown);
el.functionCode.addEventListener('change', clearRowsIfRangeChanged);
el.startAddress.addEventListener('change', clearRowsIfRangeChanged);
el.quantity.addEventListener('change', clearRowsIfRangeChanged);
el.pollEnable.addEventListener('change', async () => {
  if (el.pollEnable.checked) {
    await startPolling();
  } else {
    await stopPolling();
  }
});

ensureStatusTimer();
lastRangeKey = getCurrentRangeKey();
readAll();
</script>
</body>
</html>
